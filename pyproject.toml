[project]
name = "rlm-notebook"
version = "0.1.0"
description = "An RLM-driven notebook: paste in sources of any kind, ask grounded questions with verifiable citations, and get a distilled research artifact."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boik Su" }]
keywords = [
    "rlm",
    "rlm-harness",
    "notebook",
    "rag",
    "research",
    "agent",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rlm-harness==1.0.0",
    "pydantic>=2.9",
    # Ingestion (host-side only — see CLAUDE.md invariant 3): web extraction and PDF-to-text.
    "trafilatura>=1.12",
    # PDF text extraction + page rasterization (for OCR dispatch — parsers/_ocr.py). Wraps Google's
    # PDFium (BSD-3-Clause/Apache-2.0, verified down to every bundled native dependency) — NOT
    # pymupdf/pymupdf4llm, which this project used to depend on and which is dual-licensed AGPL-3.0
    # or a paid Artifex commercial license (`pymupdf-layout`, a pymupdf4llm transitive dependency,
    # carried a SECOND, even stricter Artifex license — Polyform Noncommercial). An MIT-licensed
    # project shipping an HTTP API meant to run as a network service (invariant 25) cannot carry an
    # AGPL dependency undisclosed — see CLAUDE.md invariant 7 for the full account of why this was
    # replaced, not merely disclosed.
    "pypdfium2>=4",
    # pypdfium2 declares NO runtime dependencies of its own — `.render(...).to_pil()` needs this
    # explicitly, not by luck via some other package's transitive dependency (the exact class of gap
    # already caught once for python-multipart, below).
    "Pillow>=10",
    # Local OCR backends `parsers/_ocr.py` dispatches scanned/image PDF pages to (RapidOCR primary,
    # Tesseract fallback). CLAUDE.md invariant 7: this ships INSTALLED BY DEFAULT, not as an opt-in
    # extra — a sibling open-source project (lfnovo/open-notebook, issue #819) shipped OCR as
    # pluggable-but-not-installed-by-default and image sources silently failed to parse in its
    # Docker image. RapidOCR (ONNX, <20MB models, CJK-strong) is primary; Tesseract is the fallback.
    # Both Apache-2.0, both CPU-only — the combined footprint is acceptable for a project whose whole
    # point is ingesting arbitrary documents.
    "rapidocr-onnxruntime>=1.3",
    "pytesseract>=0.3.10",
    # Default TTS backend for the Audio Overview (audio.py/tts.py) — free, no API key needed, so
    # `rlm-notebook audio` works out of the box. Same "ship a working default, not just a pluggable
    # interface" reasoning as the OCR backends above.
    "edge-tts>=7.2.8",
    # YouTube caption ingestion (parsers/youtube.py) — captions only, never video/audio download.
    # Pure Python, no ffmpeg requirement for this path (verified during design). Core, not an
    # opt-in extra, same "ship a working default" reasoning as OCR/TTS above.
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
# The HTTP API (api.py) is an ADDITIONAL surface, not the core CLI use case every `rlm-notebook
# ask` user needs — unlike OCR/TTS (invariants 7/15: those ship in `dependencies` because they're
# needed for the CORE product to work at all), running a web server is opt-in. Mirrors
# ctx-distillery's own precedent (its `cli` extra) for a usage-mode-specific dependency.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Starlette's multipart form parsing (POST /notebooks/{id}/sources/upload, invariant 30) needs
    # this at runtime but neither fastapi nor starlette declare it as a hard dependency — it was a
    # transitive dependency of something else in this graph, silently, until adding yt-dlp shifted
    # dependency resolution enough that it stopped being pulled in and the upload tests broke with
    # no code change of their own. Pinned explicitly now rather than relying on it arriving by luck.
    "python-multipart>=0.0.9",
]

# Run the planner and/or sub-LM on a Claude Pro/Max SUBSCRIPTION instead of an API key
# (`RN_MAIN_MODEL`/`RN_SUB_MODEL` = `claude-agent-sdk/<id>`), via rlm-harness's `ClaudeAgentLM`,
# injected by `config.setup` (CLAUDE.md invariant 35). Installs the SDK that adapter needs; it ALSO
# needs the Claude Code CLI installed and logged in — a runtime prerequisite pip cannot express.
subscription = ["claude-agent-sdk>=0.1.60"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Test-only PDF fixture construction (tests/test_parsers_pdf.py, test_ingest.py, test_api.py) —
    # BSD-licensed, never a runtime dependency of the shipped package. Replaces the fitz (pymupdf)
    # fixture-building this project used to do, which relied on pymupdf being present as a
    # (now-removed) AGPL runtime dependency — see CLAUDE.md invariant 7.
    "reportlab>=4",
]
# A dev-group MIRROR of the `subscription` extra above. It exists because an EXTRA is not synced by
# default: a bare `uv sync` PRUNES claude-agent-sdk back out, and the next subscription run dies with
# ClaudeAgentLM's ImportError for no reason the operator changed. The sibling `cve-reverser` hit this
# for real and documented the same mirror; copied rather than rediscovered.
subscription-sdk = ["claude-agent-sdk>=0.1.60"]

# Bare `uv sync` default-installs `subscription-sdk` so the SDK is never pruned from the dev venv.
# `dev` MUST stay listed — `default-groups` REPLACES uv's built-in `["dev"]`, it does not append, so
# omitting it would prune the test dependencies. The public pip extra is unaffected. Opt out for one
# sync with `uv sync --no-group subscription-sdk`.
[tool.uv]
default-groups = ["dev", "subscription-sdk"]

[project.scripts]
rlm-notebook = "rlm_notebook.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlm_notebook"]
# The web UI's static assets (rlm_notebook/web/*.html/*.css/*.js) live INSIDE this package
# deliberately, not in a top-level web/ directory — a top-level directory has no packaging entry
# here and would work from a git checkout but silently vanish from an installed wheel (found during
# the web UI's pre-implementation design audit). hatchling's default VCS-based file selection
# already includes every git-tracked file under a declared package's directory, non-.py files
# included, so no separate `artifacts`/`force-include` entry is needed on top of the line above —
# verified by building a wheel and confirming `rlm_notebook/web/index.html` is actually inside it.

[tool.ruff]
line-length = 110
target-version = "py311"

