[project]
name = "rlm-notebook"
version = "0.1.0"
description = "An RLM-driven notebook: paste in sources of any kind, ask grounded questions with verifiable citations, and get a distilled research artifact."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boik Su" }]
keywords = [
    "rlm",
    "rlm-kit",
    "notebook",
    "rag",
    "research",
    "agent",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rlm-kit",
    "pydantic>=2.9",
    # Ingestion (host-side only — see CLAUDE.md invariant 1): web extraction and PDF-to-text,
    # including pymupdf4llm's built-in hybrid OCR dispatch (see the `ocr` extra for backends).
    "trafilatura>=1.12",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
# Local OCR backends pymupdf4llm auto-detects and dispatches to for scanned/image PDF pages.
# Without this extra, pymupdf4llm still runs — it just can't OCR a page with no text layer.
# RapidOCR (ONNX, <20MB models, CJK-strong) is primary; Tesseract is pymupdf4llm's other
# supported local backend. Both Apache-2.0, both CPU-only. See CLAUDE.md's OCR invariant.
ocr = [
    "rapidocr-onnxruntime>=1.3",
    "pytesseract>=0.3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rlm-notebook = "rlm_notebook.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlm_notebook"]

[tool.ruff]
line-length = 110
target-version = "py311"

# rlm-kit is public but not on PyPI yet, so it comes in via a commit-pinned git source rather than a
# normal PyPI dependency; uv.lock pins the exact commit. Never `pip install` it directly. For local
# co-development against an in-progress rlm-kit checkout, overlay an editable install on top:
# `uv pip install -e ../rlm-kit` (see CLAUDE.md).
[tool.uv.sources]
rlm-kit = { git = "https://github.com/qazbnm456/rlm-kit.git", branch = "main" }
